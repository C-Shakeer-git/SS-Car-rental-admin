<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin &amp; Staff Login | Lakshmi Narayana Travels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }
    .admin-login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      color: #0f172a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
    }
    .brand-icon-box {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div class="text-center">
      <div class="brand-icon-box">
        <i class="fas fa-shield-alt fa-2x"></i>
      </div>
      <h3 class="fw-bold mb-1">Staff Administration</h3>
      <p class="text-muted small mb-4">Lakshmi Narayana Travels Operational Console</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger small alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info small alert-dismissible fade show" role="alert">
      <i class="fas fa-info-circle me-1"></i> <span th:text="${infoMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Staff / Admin Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fas fa-envelope text-primary"></i></span>
          <input type="email" name="email" class="form-control" value="admin@lntravels.com" required placeholder="admin@lntravels.com">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fas fa-lock text-primary"></i></span>
          <input type="password" name="password" class="form-control" value="admin123" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
        <i class="fas fa-sign-in-alt me-2"></i> Access Dashboard
      </button>
    </form>

    <div class="p-3 bg-light rounded-3 small border">
      <div class="fw-bold text-dark mb-1"><i class="fas fa-info-circle text-primary me-1"></i> Staff Credentials:</div>
      <div>Email: <strong class="font-monospace text-dark">admin@lntravels.com</strong></div>
      <div>Password: <strong class="font-monospace text-dark">admin123</strong></div>
    </div>

    <div class="text-center mt-4">
      <a href="https://ss-car-rental-users.onrender.com/" target="_blank" class="text-muted small text-decoration-none">
        <i class="fas fa-external-link-alt me-1"></i> Go to Customer Portal (Port 8081)
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
