server.port=${PORT:8082}
spring.application.name=lakshmi-narayana-travels-admin

# Google Sheets & Google Drive Integration
google.sheets.enabled=false
google.sheets.spreadsheetId=
google.sheets.credentialsPath=credentials.json
google.drive.folderId=

# Upload directory for Car Images and Verification Docs
data.uploads.dir=${UPLOADS_DIR:./uploads}

# Upload limits for Car Images and Customer Verification Docs
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.lakshminarayana=INFO

